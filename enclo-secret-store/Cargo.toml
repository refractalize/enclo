[package]
name = "enclo-secret-store"
version = "0.1.0"
edition = "2021"

[dependencies]
enclo-proxy-store-common = { path = "../enclo-proxy-store-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wildmatch = "2"
humantime-serde = "1"
anyhow = "1"
tracing = "0.1"
zeroize = "1"
libc = "0.2"
