[package]
name = "enclo-container-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "enclo-container-client"
path = "src/main.rs"

[dependencies]
enclo-backend-protocol = { path = "../enclo-backend-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
