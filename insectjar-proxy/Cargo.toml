[package]
name = "insectjar-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "insectjar-proxy"
path = "src/main.rs"

[dependencies]
insectjar-proxy-store-common = { path = "../insectjar-proxy-store-common" }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }

# HTTP
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.7"
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
http = "1"

# config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# pattern matching
wildmatch = "2"

# concurrent cert cache
dashmap = "6"

# pinentry
pinentry = "0.5"

# time
humantime-serde = "1"

# error handling
anyhow = "1"

# secret memory protection
zeroize = "1"
libc = "0.2"

# proxy authentication
argon2 = "0.5"
rpassword = "7"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

# CLI
clap = { version = "4", features = ["derive"] }

# config dir resolution
dirs-next = "2"
