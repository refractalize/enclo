[package]
name = "insectjar-secrets"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "insectjar-secrets"
path = "src/main.rs"

[dependencies]
insectjar-proxy-store-common = { path = "../insectjar-proxy-store-common" }
insectjar-secret-store = { path = "../insectjar-secret-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wildmatch = "2"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs-next = "2"
